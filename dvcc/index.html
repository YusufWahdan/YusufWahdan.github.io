<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DaVinci Control</title>
<style>
/* Public loader for DaVinci Control. It holds no data and no app code:
   with a read-only GitHub token saved in this browser, it fetches the current
   app from the private davinci-os repository and runs it. */
:root{--bg:#F6F7F9;--surface:#fff;--line:#E4E7EC;--ink:#0F1217;--ink-2:#3A414C;--muted:#69717D;--accent:#2F54EB;--warn:#9A5806;--warn-soft:#FCF0DC;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B0D11;--surface:#12151B;--line:#232831;--ink:#ECEFF4;--ink-2:#C2C8D2;--muted:#8A93A0;--accent:#7B93FF;--warn:#E8A84A;--warn-soft:#2E2314;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 20px 48px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600}
h1{font-weight:400;font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
p{color:var(--ink-2);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
ol{padding-left:20px;color:var(--ink-2);margin:0 0 18px} li{margin:6px 0}
a{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:200px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{padding:11px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:500;cursor:pointer}
button.ghost{background:none;color:var(--muted);padding:0;font-size:13px;text-decoration:underline}
.err{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.muted{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main id="root">
  <div class="brand"><div class="mark">D</div><b>DaVinci Control</b></div>
  <p class="muted" id="status">Loading…</p>
</main>
<script>
(function () {
  var API = "https://api.github.com/repos/YusufWahdan/davinci-os";
  var APP_PATH = "08_Tools/control-centre/index.html";
  var TOKEN_KEY = "dvcc-github-token", APP_CACHE = "dvcc-app-cache";
  var TOKEN_URL = "https://github.com/settings/personal-access-tokens/new?name=DaVinci%20Control&description=Read-only%20access%20for%20the%20DaVinci%20Control%20Centre&expires_in=365&contents=read";

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function fetchApp(token) {
    return fetch(API + "/contents/" + APP_PATH + "?ref=main", {
      cache: "no-store",
      headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json" }
    }).then(function (r) {
      if (r.ok) return r.text();
      var e = new Error("status " + r.status); e.status = r.status; throw e;
    }, function () { var e = new Error("network"); e.status = 0; throw e; });
  }

  function run(html) {
    document.open();
    document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body>' + html + "</body></html>");
    document.close();
  }

  function why(e) {
    if (e.status === 401) return "GitHub didn't accept the token. It may have expired or been revoked. Create a new one below.";
    if (e.status === 403 || e.status === 404) return "The token can't read davinci-os. On GitHub, give it access to the davinci-os repository with Contents set to Read-only.";
    if (e.status === 0) return "Couldn't reach GitHub. Check your internet connection and try again.";
    return "GitHub returned an error (" + e.status + "). Try again in a minute.";
  }

  function showConnect(message) {
    document.getElementById("root").innerHTML =
      '<div class="brand"><div class="mark">D</div><b>DaVinci Control</b></div>' +
      "<h1>Connect this device</h1>" +
      "<p>One time per browser. DaVinci Control then reads your davinci-os repository straight from GitHub every time you open it. The token stays in this browser and can only read.</p>" +
      '<div class="card"><ol>' +
      '<li><a href="' + TOKEN_URL + '" target="_blank" rel="noopener">Create a token on GitHub</a>. Under <b>Repository access</b> choose <b>Only select repositories</b> → <b>davinci-os</b>. Under <b>Repository permissions</b> set <b>Contents</b> to <b>Read-only</b>. Pick an expiry (up to a year), then <b>Generate token</b>.</li>' +
      "<li>Copy the token and paste it here.</li></ol>" +
      '<div class="row"><input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" aria-label="GitHub token"><button id="go">Connect</button></div>' +
      (message ? '<div class="err" role="alert">' + esc(message) + "</div>" : "") +
      '<div id="st"></div></div>';
    var input = document.getElementById("tok");
    function connect() {
      var tok = input.value.trim(); if (!tok) { input.focus(); return; }
      document.getElementById("st").innerHTML = '<p class="muted" style="margin:12px 0 0">Checking with GitHub…</p>';
      fetchApp(tok).then(function (html) { set(TOKEN_KEY, tok); set(APP_CACHE, html); run(html); },
        function (e) { document.getElementById("st").innerHTML = '<div class="err" role="alert">' + esc(why(e)) + "</div>"; });
    }
    document.getElementById("go").onclick = connect;
    input.onkeydown = function (ev) { if (ev.key === "Enter") connect(); };
  }

  var token = get(TOKEN_KEY);
  if (!token) return showConnect();
  document.getElementById("status").textContent = "Loading the latest DaVinci Control…";
  fetchApp(token).then(function (html) { set(APP_CACHE, html); run(html); }, function (e) {
    if (e.status === 0 && get(APP_CACHE)) return run(get(APP_CACHE));   // offline: last good app; it shows its own sync status
    if (e.status === 401 || e.status === 403 || e.status === 404) set(TOKEN_KEY, null);
    showConnect(why(e));
  });
})();
</script>
</body>
</html>
