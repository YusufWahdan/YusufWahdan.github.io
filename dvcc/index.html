<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DaVinci Control</title>
<style>
/* Public sign-in for DaVinci Control. It holds no data and no app code.
   The GitHub token is stored only encrypted with the sign-in password
   (PBKDF2-SHA256 + AES-GCM) and decrypted in memory after sign-in. */
:root{--bg:#F6F7F9;--surface:#fff;--line:#E4E7EC;--ink:#0F1217;--ink-2:#3A414C;--muted:#69717D;--accent:#2F54EB;--warn:#9A5806;--warn-soft:#FCF0DC;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B0D11;--surface:#12151B;--line:#232831;--ink:#ECEFF4;--ink-2:#C2C8D2;--muted:#8A93A0;--accent:#7B93FF;--warn:#E8A84A;--warn-soft:#2E2314;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:max(56px,env(safe-area-inset-top)) 20px 48px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600}
h1{font-weight:400;font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
p{color:var(--ink-2);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{padding:12px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:500;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.link{background:none;color:var(--muted);padding:0;font-size:13px;text-decoration:underline;font-weight:400;align-self:flex-start}
a{color:var(--accent)}
.err{padding:11px 13px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.step{font:500 11.5px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
ol{padding-left:18px;margin:0;color:var(--ink-2);font-size:14px} li{margin:4px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main id="root"><div class="brand"><div class="mark">D</div><b>DaVinci Control</b></div><p id="status">Loading…</p></main>
<script>
(function () {
  "use strict";
  var API = "https://api.github.com/repos/YusufWahdan/davinci-os";
  var APP_PATH = "08_Tools/control-centre/index.html";
  var VAULT = "dvcc-vault", APP_CACHE = "dvcc-app-cache", OLD_TOKEN = "dvcc-github-token";
  var ITER = 210000;
  var TOKEN_URL = "https://github.com/settings/personal-access-tokens/new?name=DaVinci%20Control&description=Read-only%20access%20for%20the%20DaVinci%20Control%20Centre&expires_in=365&contents=read";
  var root = document.getElementById("root");
  var enc = new TextEncoder(), dec = new TextDecoder();

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function b64(u8) { var s = ""; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function rand(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function norm(u) { return String(u || "").trim().toLowerCase(); }

  function baseKey(secret) { return crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey", "deriveBits"]); }
  function aesKey(user, pass, salt) {
    return baseKey(norm(user) + "\n" + pass).then(function (k) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function finHash(pass, salt) {
    return baseKey(pass).then(function (k) { return crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, k, 256); }).then(hex);
  }

  function fetchApp(token) {
    return fetch(API + "/contents/" + APP_PATH + "?ref=main", { cache: "no-store", headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json" } })
      .then(function (r) { if (r.ok) return r.text(); var e = new Error("status " + r.status); e.status = r.status; throw e; },
            function () { var e = new Error("network"); e.status = 0; throw e; });
  }
  function why(e) {
    if (e.status === 401) return "GitHub didn't accept the token. It may have expired or been revoked.";
    if (e.status === 403 || e.status === 404) return "The token can't read davinci-os. Give it access to that repository with Contents set to Read-only.";
    if (e.status === 0) return "Couldn't reach GitHub. Check your internet connection and try again.";
    return "GitHub returned an error (" + e.status + "). Try again in a minute.";
  }
  function run(html, session) {
    var boot = "<script>window.__DVCC=" + JSON.stringify(session).replace(/</g, "\\u003c") + ";<\/script>";
    document.open();
    document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body>' + boot + html + "</body></html>");
    document.close();
  }
  function page(title, intro, body) {
    root.innerHTML = '<div class="brand"><div class="mark">D</div><b>DaVinci Control</b></div><h1>' + title + "</h1>" + (intro ? "<p>" + intro + "</p>" : "") + '<form class="card" id="f" autocomplete="on" novalidate>' + body + '<div id="msg" role="alert"></div></form>';
    return document.getElementById("f");
  }
  function msg(text) { document.getElementById("msg").innerHTML = text ? '<div class="err">' + esc(text) + "</div>" : ""; }
  function busy(btn, on, label) { btn.disabled = on; btn.textContent = label; }

  /* ---------- Sign in ---------- */
  var fails = 0, lockUntil = 0;
  function signIn(vault, notice) {
    var f = page("Sign in", "", '<label>Username<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>' +
      '<label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>' +
      '<button id="go" type="submit">Sign in</button><button type="button" class="link" id="reset">Forgot your password? Set up this device again</button>');
    if (notice) msg(notice);
    document.getElementById("u").focus();
    document.getElementById("reset").onclick = function () { set(VAULT, null); setup(); };
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var btn = document.getElementById("go"), u = document.getElementById("u").value, p = document.getElementById("p").value;
      if (!u || !p) return msg("Enter your username and password.");
      if (Date.now() < lockUntil) return msg("Too many attempts. Wait " + Math.ceil((lockUntil - Date.now()) / 1000) + " seconds.");
      busy(btn, true, "Signing in…"); msg("");
      aesKey(u, p, unb64(vault.salt)).then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(vault.iv) }, key, unb64(vault.ct));
      }).then(function (plain) {
        var token = dec.decode(plain);
        busy(btn, true, "Loading…");
        return fetchApp(token).then(function (html) {
          set(APP_CACHE, html);
          run(html, { token: token, user: vault.user, fin: vault.fin });
        }, function (e) {
          if (e.status === 0 && get(APP_CACHE)) return run(get(APP_CACHE), { token: token, user: vault.user, fin: vault.fin });
          busy(btn, false, "Sign in"); msg(why(e) + (e.status === 401 || e.status === 403 || e.status === 404 ? " Use “Set up this device again” with a new token." : ""));
        });
      }, function () {
        fails++; if (fails >= 5) { lockUntil = Date.now() + 30000 * Math.pow(2, fails - 5); }
        busy(btn, false, "Sign in"); msg("Username or password is incorrect.");
        document.getElementById("p").value = ""; document.getElementById("p").focus();
      });
    };
  }

  /* ---------- First-time setup on this device ---------- */
  function setup() {
    var old = get(OLD_TOKEN) || "";
    var f = page("Set up this device", "One time per browser. You choose a username and password for signing in, and a separate password for Finance. Your GitHub token is stored encrypted with your sign-in password.",
      '<div class="step">1 · GitHub access</div>' +
      (old ? '<p style="margin:0">This device already has a GitHub token. It will be kept, encrypted.</p><input id="t" type="hidden" value="' + esc(old) + '">' :
      '<ol><li><a href="' + TOKEN_URL + '" target="_blank" rel="noopener">Create a token on GitHub</a>.</li><li>Repository access: <b>Only select repositories</b> → <b>davinci-os</b>.</li><li>Repository permissions: <b>Contents</b> → <b>Read-only</b>. Then <b>Generate token</b>.</li></ol>' +
      '<label>GitHub token<input id="t" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>') +
      '<div class="step">2 · Sign-in</div>' +
      '<label>Username<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
      '<label>Password (at least 10 characters)<input id="p" name="new-password" type="password" autocomplete="new-password"></label>' +
      '<label>Confirm password<input id="p2" type="password" autocomplete="new-password"></label>' +
      '<div class="step">3 · Finance password</div>' +
      '<label>Finance password (different, at least 8 characters)<input id="fp" type="password" autocomplete="off"></label>' +
      '<label>Confirm finance password<input id="fp2" type="password" autocomplete="off"></label>' +
      '<button id="go" type="submit">Save and sign in</button>');
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var v = function (id) { return document.getElementById(id).value; };
      var t = v("t").trim(), u = norm(v("u")), p = v("p"), fp = v("fp");
      if (!t) return msg("Paste your GitHub token.");
      if (!u) return msg("Choose a username.");
      if (p.length < 10) return msg("Your password needs at least 10 characters.");
      if (p !== v("p2")) return msg("The two passwords don't match.");
      if (fp.length < 8) return msg("The finance password needs at least 8 characters.");
      if (fp !== v("fp2")) return msg("The two finance passwords don't match.");
      if (fp === p) return msg("Use a different password for Finance.");
      var btn = document.getElementById("go"); busy(btn, true, "Checking with GitHub…"); msg("");
      fetchApp(t).then(function (html) {
        busy(btn, true, "Securing…");
        var salt = rand(16), iv = rand(12), fsalt = rand(16);
        return Promise.all([aesKey(u, p, salt), finHash(fp, fsalt)]).then(function (r) {
          return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, r[0], enc.encode(t)).then(function (ct) {
            var vault = { v: 1, user: u, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)), fin: { salt: b64(fsalt), iter: ITER, hash: r[1] } };
            set(VAULT, JSON.stringify(vault)); set(OLD_TOKEN, null); set("dvcc-cache", null); set(APP_CACHE, html);
            run(html, { token: t, user: u, fin: vault.fin });
          });
        });
      }, function (e) { busy(btn, false, "Save and sign in"); msg(why(e)); });
    };
  }

  if (!window.crypto || !crypto.subtle) {
    root.innerHTML = '<div class="brand"><div class="mark">D</div><b>DaVinci Control</b></div><div class="err">This browser can\'t do the encryption DaVinci Control needs. Update the browser, or open it in Safari or Chrome.</div>';
    return;
  }
  var vault = null; try { vault = JSON.parse(get(VAULT) || "null"); } catch (e) {}
  if (vault && vault.ct) signIn(vault); else setup();
})();
</script>
</body>
</html>
